name: test

on:
  pull_request:
  push:
    branches:
      - utably-dev
      - utably-test
      - utably-staging
      - utably-prod

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      # This repo has zero runtime dependencies and zero devDependencies.
      # `npm install` is a no-op but we run it anyway so that future
      # additions to package.json are honored without editing this workflow.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
