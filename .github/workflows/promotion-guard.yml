name: Promotion Guard

on:
  pull_request:
    branches: [utably-dev, utably-test, utably-staging, utably-prod]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce allowed source -> target branch pairs
        run: |
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          echo "PR: $head_repo:$head -> $base"

          case "$base" in
            utably-test)    allowed="utably-dev" ;;
            utably-staging) allowed="utably-test" ;;
            utably-prod)    allowed="utably-staging" ;;
            *)              exit 0 ;; # no restriction for other base branches
          esac

          if [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "Promotion PRs into '$base' must come from this repository, not a fork (got '$head_repo')."
            exit 1
          fi

          if [ "$allowed" != "$head" ]; then
            echo "Only '$allowed' may open PRs into '$base' (got '$head')."
            exit 1
          fi

          echo "Allowed."
